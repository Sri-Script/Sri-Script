name: 🕹️ Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    name: Generate & Deploy Pac-Man Graph
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # Generates the SVG and places it directly inside your existing docs folder
      - name: 🎮 Generate Pac-Man contribution graph SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs_folder: docs

      # Deploys the entire docs folder (which now holds index.html + the SVG)
      - name: 🚀 Deploy complete bundle to 'output' branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: docs  # Points directly to your docs directory
          commit_message: "chore: update pac-man contribution graph [skip ci]"
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
