name: 🕹️ Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    name: Generate & Deploy Pac-Man Graph
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🎮 Generate Pac-Man contribution graph SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs_folder: dist  # Puts the generated graphic inside a folder named 'dist'

      # ─── NEW CRITICAL STEP ────────────────────────────────────────────────
      # This explicitly copies your index.html into the 'dist' folder 
      # so it gets bundled up and deployed together with your assets!
      - name: 📝 Stage frontend entrypoint for deployment
        run: |
          cp index.html dist/

      - name: 🚀 Deploy complete bundle to 'output' branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist  # Deploys the folder containing BOTH index.html and the SVG
          commit_message: "chore: update pac-man contribution graph [skip ci]"
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
