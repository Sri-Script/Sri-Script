name: 🕹️ Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"   # Runs daily at midnight UTC
  workflow_dispatch:        # Manual trigger from Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    name: Generate & Deploy Pac-Man Graph
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write  # Required to push to the output branch

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🎮 Generate Pac-Man contribution graph SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs_folder: dist   # Explicitly declare output folder

      - name: ✅ Verify dist folder was created
        run: |
          echo "--- Contents of dist/ ---"
          ls -la dist/
          echo "-------------------------"

      - name: 🚀 Deploy SVGs to 'output' branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: .   # <--- Changed from 'dist' to '.' to fix the error!
          commit_message: "chore: update pac-man contribution graph [skip ci]"
          jekyll: false   # Disable Jekyll so SVGs are served raw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
